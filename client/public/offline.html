<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#090b12" />
    <title>You are offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #090b12; color: #f5f5ef; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid rgb(255 255 255 / 12%); border-radius: 28px; background: #10131e; box-shadow: 0 24px 80px rgb(0 0 0 / 35%); }
      .mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: #c8ff4d; color: #090b12; font-size: 28px; }
      h1 { margin: 24px 0 8px; font-size: 1.75rem; }
      p { margin: 0; color: #aab0c0; line-height: 1.65; }
      button { min-height: 48px; margin-top: 24px; border: 0; border-radius: 14px; padding: 0 20px; background: #c8ff4d; color: #090b12; font: inherit; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 3px solid #57d5ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>You are offline</h1>
      <p>Your private workspace stays on the server. Reconnect to continue working with your social media manager.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
